name: Atualizar cotações cambiais

on:
  workflow_dispatch:
  schedule:
    # Diariamente às 21:00 UTC, equivalente a 18:00 em Fortaleza.
    - cron: "0 21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cotacoes-cambiais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Consultar AwesomeAPI e Banco Central
        env:
          AWESOME_API_KEY: ${{ secrets.AWESOME_API_KEY }}
        run: python scripts/atualizar.py

      - name: Registrar JSON no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cotacao.json docs/historico.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos arquivos de cotação."
          else
            git commit -m "Atualização automática: comercial e PTAX oficial"
            for tentativa in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Histórico enviado com sucesso."
                break
              fi
              if [ "$tentativa" -eq 3 ]; then
                echo "::error::Falha ao publicar os dados após 3 tentativas."
                exit 1
              fi
              sleep "$((tentativa * 2))"
            done
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
